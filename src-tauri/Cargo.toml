[package]
name = "study-flow-organizer"
version = "4.2.0"
description = "Smart Academic Deadlines, Schedule & Course Folders Hub"
authors = ["Study Flow Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "shell-open", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
