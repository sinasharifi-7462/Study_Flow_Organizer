<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Flow | Smart Academic Schedule, Deadlines & Materials Hub</title>
    
    <!-- Application Icons -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">

    <!-- Modular Stylesheets -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/views.css">
    <link rel="stylesheet" href="./css/modals.css">
    <link rel="stylesheet" href="./css/custom-controls.css">
</head>
<body>

    <!-- ========================================================================
         APP HEADER
         ======================================================================== -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand-section">
                <div class="brand-logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                </div>
                <div class="brand-info">
                    <h1>Study Flow Organizer</h1>
                    <!-- Dual Date Indicator: Gregorian + Shamsi -->
                    <p id="headerCurrentDateText">Loading calendar...</p>
                </div>
            </div>

            <div class="header-actions">
                <!-- Minimalist Single-Color AI Schedule Assistant Trigger -->
                <button type="button" class="header-icon-btn" id="btnOpenAiModal" title="AI Schedule Assistant (Hold Space / Alt+A to speak, click to open)">
                    <svg viewBox="0 0 24 24" class="ai-sparkle-icon" fill="currentColor">
                        <path d="M10 3C10 7.418 6.418 11 2 11C6.418 11 10 14.582 10 19C10 14.582 13.582 11 18 11C13.582 11 10 7.418 10 3Z"/>
                        <path d="M18 2C18 4.209 16.209 6 14 6C16.209 6 18 7.791 18 10C18 7.791 19.791 6 22 6C19.791 6 18 4.209 18 2Z"/>
                    </svg>
                </button>

                <!-- Minimalist Single-Color "+" Create Button with Dropdown -->
                <div class="dropdown-wrap" id="headerCreateDropdownWrap">
                    <button type="button" class="header-icon-btn" id="headerMainCreateBtn" title="Create New...">
                        <svg viewBox="0 0 24 24">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                    <div class="floating-dropdown-menu hidden" id="headerCreateMenu">
                        <button type="button" class="dropdown-item" id="menuNewTaskBtn">
                            <span class="item-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
                            <div class="item-content">
                                <span class="item-title">New Task</span>
                                <span class="item-desc">Homework, assignment, or project</span>
                            </div>
                        </button>
                        <button type="button" class="dropdown-item" id="menuNewEventBtn">
                            <span class="item-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
                            <div class="item-content">
                                <span class="item-title">New Event</span>
                                <span class="item-desc">Quiz, exam, or review session</span>
                            </div>
                        </button>
                        <div class="dropdown-divider"></div>
                        <button type="button" class="dropdown-item" id="menuNewSubjectBtn">
                            <span class="item-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
                            <div class="item-content">
                                <span class="item-title">New Course Subject</span>
                                <span class="item-desc">Add an academic course</span>
                            </div>
                        </button>
                        <button type="button" class="dropdown-item" id="menuNewMaterialBtn">
                            <span class="item-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
                            <div class="item-content">
                                <span class="item-title">Link Course Folder</span>
                                <span class="item-desc">Connect materials to local Explorer</span>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Course Trash Bin Button (Req 7) -->
                <button type="button" class="header-icon-btn" id="btnTrashHeader" title="Course Trash Bin">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>

                <!-- Minimalist Single-Color Settings Button -->
                <button type="button" class="header-icon-btn" id="btnSettingsHeader" title="Settings & Storage">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- ========================================================================
         MAIN TOOLBAR: MINIMALIST CONTROL BAR (2-TIER STREAMLINED)
         ======================================================================== -->
    <div class="main-toolbar">
        <!-- Tier 1: Search & Segmented View Switcher -->
        <div class="toolbar-top-row">
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="globalSearchInput" class="search-input" placeholder="Search tasks, courses, notes...">
                <kbd class="search-kbd-hint" id="searchKbdHint" title="Press '/' to focus search">/</kbd>
                <button type="button" id="clearSearchBtn" class="search-clear" title="Clear search">&times;</button>
            </div>

            <!-- 1-Click Segmented View Switcher (Press 1, 2, 3, 4) -->
            <div class="view-segmented-control" id="viewSegmentedControl" role="tablist" aria-label="Views">
                <button type="button" class="segmented-tab active" data-view="grid" title="Cards Grid (Press 1)">
                    <span class="tab-icon"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></span>
                    <span class="tab-label">Cards</span>
                    <span class="tab-shortcut">1</span>
                </button>
                <button type="button" class="segmented-tab" data-view="calendar" title="Calendar View (Press 2)">
                    <span class="tab-icon"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
                    <span class="tab-label">Calendar</span>
                    <span class="tab-shortcut">2</span>
                </button>
                <button type="button" class="segmented-tab" data-view="timeline" title="Timeline View (Press 3)">
                    <span class="tab-icon"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
                    <span class="tab-label">Timeline</span>
                    <span class="tab-shortcut">3</span>
                </button>
                <button type="button" class="segmented-tab" data-view="kanban" title="Kanban Board (Press 4)">
                    <span class="tab-icon"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="4.5" height="16" rx="1"/><rect x="9.75" y="4" width="4.5" height="12" rx="1"/><rect x="16.5" y="4" width="4.5" height="16" rx="1"/></svg></span>
                    <span class="tab-label">Kanban</span>
                    <span class="tab-shortcut">4</span>
                </button>
            </div>
        </div>

        <!-- Tier 2: Streamlined Status Filters + Integrated Inline Counters + Compact Topics Strip -->
        <div class="toolbar-secondary-row">
            <div class="filter-pills-wrap" role="tablist" aria-label="Status Filters">
                <button type="button" class="filter-pill active" data-filter="all" title="All Items">
                    <span class="pill-label">All</span>
                    <span class="pill-count" id="statTotalTasks">0</span>
                </button>
                <button type="button" class="filter-pill" data-filter="only_tasks" title="Tasks Only">
                    <span class="pill-label">Tasks</span>
                    <span class="pill-count" id="statCountTasks">0</span>
                </button>
                <button type="button" class="filter-pill" data-filter="only_events" title="Events Only">
                    <span class="pill-label">Events</span>
                    <span class="pill-count" id="statCountEvents">0</span>
                </button>
                <button type="button" class="filter-pill filter-pill-urgent" data-filter="urgent" title="Due in <48h">
                    <span class="pill-label">Urgent</span>
                    <span class="pill-count urgent-badge" id="statUrgentTasks">0</span>
                </button>
                <button type="button" class="filter-pill" data-filter="pending" title="In Progress Items">
                    <span class="pill-label">In Progress</span>
                </button>
                <button type="button" class="filter-pill filter-pill-done" data-filter="completed" title="Completed Items">
                    <span class="pill-label">Done</span>
                    <span class="pill-count" id="statCompletedTasks">0</span>
                </button>
            </div>

            <div class="toolbar-divider" aria-hidden="true"></div>

            <div class="tags-filter-strip-row" id="tagsFilterStripRow">
                <span class="tags-filter-title">Topics</span>
                <div class="tags-pills-scroll-wrap" id="tagsPillsScrollWrap"></div>
                <button type="button" class="btn-add-tag-filter" id="btnOpenNewTagModal" title="Manage Topics">
                    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================================================
         MAIN CONTENT AREA (VIEWS)
         ======================================================================== -->
    <main class="main-content">
        <!-- 1. Grid View (Cards with compact task drawer) -->
        <div id="gridContentView" class="subjects-grid"></div>

        <!-- 2. Academic Calendar View -->
        <div id="calendarContentView" class="calendar-view-wrapper hidden"></div>

        <!-- 3. Proportional Timeline View -->
        <div id="timelineContentView" class="timeline-view-wrapper hidden"></div>

        <!-- 4. Interactive Kanban Board View -->
        <div id="kanbanContentView" class="kanban-view-wrapper hidden"></div>
    </main>

    <!-- ========================================================================
         DESKTOP COMMAND PALETTE (Ctrl+K / Cmd+K)
         ======================================================================== -->
    <div id="cmdPaletteOverlay" class="cmd-palette-overlay hidden">
        <div class="cmd-palette-box">
            <div class="cmd-palette-header">
                <span class="cmd-palette-search-icon">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </span>
                <input type="text" id="cmdPaletteInput" class="cmd-palette-input" placeholder="Type a command or search courses, tasks..." autocomplete="off">
                <span class="cmd-palette-esc-badge">ESC</span>
            </div>
            <div class="cmd-palette-results" id="cmdPaletteResults"></div>
            <div class="cmd-palette-footer">
                <span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span>
                <span><kbd>↵</kbd> select</span>
                <span><kbd>ESC</kbd> dismiss</span>
            </div>
        </div>
    </div>

    <!-- ========================================================================
         DYNAMIC MODAL MOUNT CONTAINER
         ======================================================================== -->
    <div id="modalContainer"></div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Application Module Entry Point -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
